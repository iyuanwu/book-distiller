[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-distiller"
dynamic = ["version"]
description = "Local Codex-driven book distillation foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3", "typer>=0.12,<1", "rich>=13,<15", "jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
book = "book_distiller.cli.main:app"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["book_distiller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
